[project]
name = "vis-poison"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate==1.13.0",
    "diffusers==0.37.1",
    "faiss-cpu>=1.13.2",
    "numpy==1.26.4",
    "ollama",
    "openai>=2.32.0",
    "pillow==12.2.0",
    "protobuf>=5.29.3",
    "qwen-vl-utils>=0.0.14",
    "safetensors==0.7.0",
    "sentencepiece==0.2.1",
    "torch==2.11.0+cu126",
    "torchvision==0.26.0+cu126",
    "transformers==5.6.0",
]

[tool.uv]
environments = ["sys_platform == 'linux' or sys_platform == 'win32'"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://mirrors.nju.edu.cn/pytorch/whl/cu126"
explicit = true
